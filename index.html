<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ทดสอบ AR สินค้า</title>

  <script type="module" 

    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">

  </script>

  <style>

    body { margin: 0; font-family: sans-serif; text-align: center; }

    model-viewer {

      width: 100%;

      height: 90vh;

      background-color: #eee;

    }

  </style>

</head>

<body>


  <model-viewer 

    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"

    ar 

    ar-modes="webxr scene-viewer quick-look"

    camera-controls

    auto-rotate

    shadow-intensity="1"

    alt="โมเดลทดสอบ AR">

    <button slot="ar-button" style="background:#ff9800;color:white;border:none;padding:12px 24px;font-size:16px;border-radius:8px;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);">

      📱 ดูในห้องจริง (AR)

    </button>

  </model-viewer>


</body>

</html>
