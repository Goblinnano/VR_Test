<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>เก้าอี้อาร์มแชร์ Modern Sheen - ดูสินค้าแบบ 3D/AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- วิดีโอกล้องหลังสำหรับโหมดกล้องในเว็บ (iOS & Android) -->
  <video id="cameraFeed" autoplay playsinline muted></video>

  <div class="header">
    <h1>เก้าอี้อาร์มแชร์โมเดิร์น (Modern Armchair)</h1>
    <p>เก้าอี้พักผ่อนสไตล์โมเดิร์น ดีไซน์สวยงาม เหมาะสำหรับห้องนั่งเล่นและห้องทำงาน</p>
  </div>

  <div class="viewer-container">
    <model-viewer
      id="viewer"
      src="https://modelviewer.dev/assets/ShopifyModels/Chair.glb"
      alt="เก้าอี้อาร์มแชร์โมเดิร์น 3D/AR"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      camera-controls
      disable-zoom
      auto-rotate
      auto-rotate-delay="1000"
      shadow-intensity="1"
      exposure="1"
      loading="eager"
      reveal="auto">

      <!-- แถบดาวน์โหลด (Progress Bar) ด้านบนสุด -->
      <div class="progress-bar" slot="progress-bar">
        <div class="update-bar"></div>
      </div>

      <!-- ปุ่ม AR เดิมของ model-viewer ซ่อนไว้ -->
      <button slot="ar-button" id="nativeArButton" style="display: none;"></button>

      <!-- Toast แจ้งเตือนสถานะ -->
      <div id="ar-toast" class="ar-toast"></div>

    </model-viewer>

    <!-- Loading spinner ตอนรอโหลดโมเดล -->
    <div class="loading-spinner" id="spinner"></div>

    <!-- ปุ่มเปิดกล้อง AR (Web Camera AR สำหรับ iPhone & Android) -->
    <div class="action-buttons">
      <button id="openCameraBtn" class="ar-btn">
        📷 เปิดกล้องดูในห้องจริง
      </button>
      <button id="quickLookBtn" class="sub-ar-btn" title="เปิดแอป Quick Look ของ Apple">
        📱 Quick Look (Apple AR)
      </button>
    </div>
  </div>

  <div class="hint">👆 ลากนิ้วเพื่อหมุนดูสินค้า</div>

  <!-- แผงฟังก์ชันควบคุม (ในกล้องจะย้ายไปอยู่ซ้ายบน เรียงเป็นแถวเดียวลงมา พร้อมไฮไลท์สีเมื่อเปิดใช้งาน) -->
  <div id="cameraControls" class="camera-controls">
    <div class="camera-hint">👆 ใช้นิ้วลากเพื่อหมุนดูสินค้า 360°</div>
    <div class="camera-btn-group">
      <button id="moveBtn" class="control-btn" title="กดเพื่อเปิด/ปิดโหมดย้ายตำแหน่ง">🖐️ ย้ายตำแหน่ง</button>
      <button id="rotateBtn" class="control-btn is-active" title="กดเพื่อหยุดการหมุน">⏸️ หยุดหมุน</button>
      <button id="resetBtn" class="control-btn" title="รีเซ็ตกลับตรงกลาง">🎯 รีเซ็ตตรงกลาง</button>
    </div>
    <button id="closeCameraBtn" class="close-camera-btn">✕ ปิดกล้อง</button>
  </div>

  <div class="error-box" id="errorBox">
    ⚠️ ไม่สามารถโหลดโมเดลได้ กรุณาลองใหม่อีกครั้ง
  </div>

  <script src="script.js"></script>

</body>
</html>
